<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel | VF FILHOS LANCHES</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#050505;
    --panel:#0c0c0c;
    --panel2:#111;
    --border:#292929;
    --gold:#d4af37;
    --gold2:#b8941f;
    --text:#fff;
    --muted:#999;
    --green:#36c76f;
    --red:#e05252;
    --blue:#4da3ff;
    --orange:#e7a93d;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

/* ================= HEADER ================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;
    height:72px;
    background:#070707;
    border-bottom:1px solid var(--gold2);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo{
    width:125px;
    max-height:55px;
    object-fit:contain;
}

.brand-title{
    border-left:1px solid #333;
    padding-left:15px;
}

.brand-title strong{
    display:block;
    color:var(--gold);
    font-size:15px;
}

.brand-title span{
    display:block;
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-btn{
    background:#111;
    border:1px solid #333;
    color:#fff;
    border-radius:9px;
    height:40px;
    padding:0 14px;
    cursor:pointer;
}

.header-btn:hover{
    border-color:var(--gold);
    color:var(--gold);
}

.status-online{
    display:flex;
    align-items:center;
    gap:7px;
    color:#aaa;
    font-size:12px;
}

.status-dot{
    width:9px;
    height:9px;
    background:var(--green);
    border-radius:50%;
    box-shadow:0 0 8px rgba(54,199,111,.6);
}

/* ================= MAIN ================= */

.main{
    max-width:1600px;
    margin:auto;
    padding:24px;
}

/* ================= TOP ================= */

.top-area{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    margin-bottom:22px;
}

.page-title h1{
    font-size:28px;
    color:#fff;
}

.page-title p{
    margin-top:6px;
    color:var(--muted);
    font-size:14px;
}

.date-box{
    color:var(--muted);
    font-size:13px;
}

/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:13px;
    margin-bottom:22px;
}

.stat{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:13px;
    padding:17px;
}

.stat:hover{
    border-color:#5b4c1d;
}

.stat-label{
    color:var(--muted);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.5px;
}

.stat-number{
    color:#fff;
    font-size:28px;
    font-weight:bold;
    margin-top:8px;
}

.stat.gold .stat-number{
    color:var(--gold);
}

.stat.green .stat-number{
    color:var(--green);
}

.stat.orange .stat-number{
    color:var(--orange);
}

.stat.blue .stat-number{
    color:var(--blue);
}

/* ================= FILTER ================= */

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search{
    flex:1;
}

.search input,
.filter select{
    width:100%;
    height:45px;
    background:#0e0e0e;
    border:1px solid #303030;
    border-radius:9px;
    color:#fff;
    padding:0 13px;
    outline:none;
}

.search input:focus,
.filter select:focus{
    border-color:var(--gold);
}

.filter{
    width:200px;
}

/* ================= KANBAN ================= */

.board{
    display:grid;
    grid-template-columns:repeat(5,minmax(260px,1fr));
    gap:14px;
    overflow-x:auto;
    padding-bottom:10px;
}

.column{
    background:#080808;
    border:1px solid var(--border);
    border-radius:14px;
    min-height:500px;
    overflow:hidden;
}

.column-header{
    padding:15px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.column-title{
    display:flex;
    align-items:center;
    gap:9px;
    font-weight:bold;
    font-size:14px;
}

.column-count{
    min-width:25px;
    height:25px;
    padding:0 7px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:20px;
    background:#191919;
    color:var(--gold);
    font-size:12px;
}

.column-body{
    padding:10px;
}

/* ================= PEDIDO ================= */

.order{
    background:var(--panel);
    border:1px solid #242424;
    border-radius:11px;
    margin-bottom:10px;
    overflow:hidden;
}

.order:hover{
    border-color:#65541f;
}

.order.new-order{
    border-color:var(--gold);
    box-shadow:0 0 0 1px rgba(212,175,55,.1);
}

.order-head{
    padding:13px;
    border-bottom:1px solid #202020;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.order-number{
    color:var(--gold);
    font-size:17px;
    font-weight:bold;
}

.order-time{
    color:#777;
    font-size:11px;
    margin-top:4px;
}

.order-total{
    color:#fff;
    font-weight:bold;
    font-size:14px;
}

.order-body{
    padding:13px;
}

.customer{
    margin-bottom:12px;
}

.customer-name{
    font-weight:bold;
    font-size:14px;
}

.customer-phone{
    color:#999;
    font-size:12px;
    margin-top:3px;
}

.delivery-tag{
    display:inline-block;
    margin-top:8px;
    padding:5px 8px;
    border-radius:6px;
    background:#191919;
    color:var(--gold);
    font-size:10px;
    font-weight:bold;
    text-transform:uppercase;
}

.items{
    border-top:1px solid #202020;
    padding-top:10px;
}

.item{
    display:flex;
    justify-content:space-between;
    gap:8px;
    padding:5px 0;
    font-size:12px;
}

.item-name{
    color:#ddd;
}

.item-price{
    color:#aaa;
    white-space:nowrap;
}

.address{
    background:#111;
    border-radius:8px;
    padding:9px;
    margin-top:10px;
    color:#aaa;
    font-size:11px;
    line-height:1.5;
}

.payment{
    margin-top:10px;
    color:#bbb;
    font-size:11px;
}

.payment strong{
    color:#fff;
}

.notes{
    margin-top:10px;
    padding:9px;
    border-left:2px solid var(--gold);
    background:#111;
    color:#bbb;
    font-size:11px;
}

.order-actions{
    padding:11px;
    border-top:1px solid #202020;
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.action{
    flex:1;
    min-width:100px;
    min-height:36px;
    border:0;
    border-radius:7px;
    padding:7px 9px;
    font-weight:bold;
    font-size:11px;
    cursor:pointer;
}

.action:hover{
    filter:brightness(1.12);
}

.accept{
    background:var(--gold);
    color:#000;
}

.reject{
    background:#321414;
    color:#ff7777;
    border:1px solid #5b2020;
}

.prepare{
    background:#252018;
    color:var(--gold);
    border:1px solid #59491b;
}

.ready{
    background:#15301f;
    color:#65dd91;
    border:1px solid #285a3a;
}

.delivery{
    background:#182b3d;
    color:#70b9ff;
    border:1px solid #294c6e;
}

.complete{
    background:#14331f;
    color:#6de494;
    border:1px solid #285f3b;
}

/* ================= EMPTY ================= */

.empty{
    padding:30px 15px;
    text-align:center;
    color:#555;
    font-size:12px;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    z-index:3000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:620px;
    max-height:90vh;
    overflow-y:auto;
    background:#0a0a0a;
    border:1px solid var(--gold);
    border-radius:15px;
    padding:22px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #222;
    padding-bottom:15px;
    margin-bottom:17px;
}

.modal-head h2{
    color:var(--gold);
}

.close{
    width:38px;
    height:38px;
    background:#151515;
    border:1px solid #333;
    color:#fff;
    border-radius:8px;
    cursor:pointer;
    font-size:20px;
}

.detail-section{
    margin-bottom:17px;
}

.detail-section h3{
    color:var(--gold);
    font-size:13px;
    margin-bottom:8px;
    text-transform:uppercase;
}

.detail-box{
    background:#111;
    border-radius:9px;
    padding:12px;
    color:#bbb;
    font-size:13px;
    line-height:1.7;
}

.detail-item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid #222;
    padding:7px 0;
}

.detail-item:last-child{
    border-bottom:0;
}

.modal-total{
    display:flex;
    justify-content:space-between;
    border-top:1px solid #333;
    padding-top:14px;
    font-size:19px;
    font-weight:bold;
}

.modal-total span:last-child{
    color:var(--gold);
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    right:25px;
    bottom:25px;
    background:var(--gold);
    color:#000;
    padding:13px 18px;
    border-radius:8px;
    font-weight:bold;
    font-size:13px;
    transform:translateY(100px);
    opacity:0;
    transition:.25s;
    z-index:5000;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* ================= MOBILE ================= */

@media(max-width:1100px){

    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .board{
        grid-template-columns:repeat(5,280px);
    }

}

@media(max-width:700px){

    .header{
        padding:0 12px;
    }

    .brand-title{
        display:none;
    }

    .logo{
        width:105px;
    }

    .main{
        padding:16px 12px;
    }

    .top-area{
        align-items:flex-start;
        flex-direction:column;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .toolbar{
        flex-direction:column;
    }

    .filter{
        width:100%;
    }

    .board{
        grid-template-columns:repeat(5,285px);
        overflow-x:auto;
    }

    .status-online{
        display:none;
    }

}

</style>
</head>

<body>

<header class="header">

    <div class="brand">

        <img
            src="logo-vf.jpeg"
            class="logo"
            alt="VF FILHOS LANCHES"
        >

        <div class="brand-title">
            <strong>VF FILHOS LANCHES</strong>
            <span>Painel de pedidos</span>
        </div>

    </div>

    <div class="header-actions">

        <div class="status-online">
            <span class="status-dot"></span>
            Sistema online
        </div>

        <button
            class="header-btn"
            onclick="carregarPedidos()">
            Atualizar
        </button>

    </div>

</header>


<main class="main">

    <div class="top-area">

        <div class="page-title">

            <h1>Pedidos</h1>

            <p>
                Acompanhe e gerencie todos os pedidos da loja.
            </p>

        </div>

        <div
            class="date-box"
            id="dataAtual">
        </div>

    </div>


    <!-- ================= ESTATÍSTICAS ================= -->

    <section class="stats">

        <div class="stat gold">

            <div class="stat-label">
                Novos
            </div>

            <div
                class="stat-number"
                id="statNovo">

            </div>

        </div>

        <div class="stat">

            <div class="stat-label">

            <div
                class="stat-number"
                id="statAceito">
                0
            </div>

        </div>

        <div class="stat orange">

            <div class="stat-label">
                Preparando
            </div>

            <div
                class="stat-number"
                id="statPreparando">

            </div>

        </div>

        <div class="stat blue">

            <div class="stat-label">
                Prontos
            </div>

            <div
                class="stat-number"
                id="statPronto">
                0
            </div>

        </div>

        <div class="stat green">

            <div class="stat-label">
                Entregues
            </div>

            <div
                class="stat-number"

        </div>

    </section>


    <!-- ================= FILTROS ================= -->

    <div class="toolbar">

        <div class="search">

            <input
                type="search"

                onchange="renderPedidos()">

                <div

                    id="countAceito">

            </div>

            <div
                class="column-body"

            </div>

        </div>


        <div class="column">

            <div class="column-header">

                <div class="column-title">
                    Preparando
                </div>

                <div
                    class="column-count"
                    id="countPreparando">
                    0
                </div>

            </div>

            <div
                class="column-body"
                id="colPreparando">
            </div>

        </div>


        <div class="column">

            <div class="column-header">

                <div class="column-title">
                    Prontos
                </div>

                <div
                    class="column-count"
                    id="countPronto">
                    0
                </div>

            </div>

            <div
                class="column-body"
                id="colPronto">

        <div class="column">

            <div class="column-header">

                    Em entrega

<!-- ================= MODAL DETALHES ================= -->

<div
    class="modal"
    id="detailModal">

    <div class="modal-box">

        <div class="modal-head">

            <h2 id="modalTitle">
                Pedido
            </h2>

            <button
                class="close"
                onclick="fecharDetalhes()">
                ×
            </button>

        </div>

        <div id="modalContent"></div>

    </div>

</div>


<div
    class="toast"
    id="toast">
</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://zjfgmokdcwzwpoancpgr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XSySYoAnL4D2xydCg98Lrg_JWB4ulQL";


/* =====================================================
   ESTADO
===================================================== */

let pedidos = [];


/* =====================================================
   FORMATADORES
===================================================== */

function dinheiro(valor){

    return Number(valor || 0)
        .toLocaleString("pt-BR",{
            style:"currency",
            currency:"BRL"
        });

}


function escapeHTML(valor){

    if(valor === null || valor === undefined){
        return "";
    }

    return String(valor)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function mostrarToast(texto){

    const toast =
        document.getElementById("toast");

    toast.textContent = texto;

    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },2500);

}


/* =====================================================
   DATA
===================================================== */

function atualizarData(){

    const agora = new Date();

    document.getElementById("dataAtual")
        .textContent =
        agora.toLocaleDateString(
            "pt-BR",
            {
                weekday:"long",
                day:"2-digit",
                month:"long",
                year:"numeric"
            }
        );

}

atualizarData();


/* =====================================================
   BUSCAR PEDIDOS
===================================================== */

async function carregarPedidos(){

    try{

        const resposta = await fetch(
            `${SUPABASE_URL}/rest/v1/pedidos?select=*&order=criado_em.desc`,
            {
                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`
                }
            }
        );

        if(!resposta.ok){

            const erro =
                await resposta.text();

            console.error(erro);

            mostrarToast(
                "Erro ao carregar pedidos."
            );

            return;
        }

        pedidos = await resposta.json();

        renderPedidos();

    }catch(erro){

        console.error(erro);

        mostrarToast(
            "Erro de conexão com o servidor."
        );

    }

}


/* =====================================================
   FILTROS
===================================================== */

function pedidoVisivel(pedido){

    const busca =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();

    const filtro =
        document
        .getElementById("statusFilter")
        .value;


    if(
        filtro !== "todos" &&
        pedido.status !== filtro
    ){
        return false;
    }


    if(!busca){
        return true;
    }


    const numero =
        String(
            pedido.numero_pedido || pedido.id || ""
        ).toLowerCase();

    const nome =
        String(
            pedido.cliente_nome || ""
        ).toLowerCase();

    const telefone =
        String(
            pedido.telefone || ""
        ).toLowerCase();


    return (
        numero.includes(busca) ||
        nome.includes(busca) ||
        telefone.includes(busca)
    );

}


/* =====================================================
   STATUS
===================================================== */

function normalizarStatus(status){

    return status || "novo";

}


/* =====================================================
   RENDER
===================================================== */

function renderPedidos(){

    const colunas = {

        novo:
            document.getElementById("colNovo"),

        aceito:
            document.getElementById("colAceito"),

        preparando:
            document.getElementById("colPreparando"),

        pronto:
            document.getElementById("colPronto"),

        saiu_entrega:
            document.getElementById("colEntrega")

    };


    Object.values(colunas)
        .forEach(coluna=>{
            coluna.innerHTML = "";
        });


    const contagens = {
        novo:0,
        aceito:0,
        preparando:0,
        pronto:0,
        saiu_entrega:0,
        entregue:0
    };


    pedidos.forEach(pedido=>{

        const status =
            normalizarStatus(pedido.status);

        if(contagens[status] !== undefined){
            contagens[status]++;
        }


        if(!pedidoVisivel(pedido)){
            return;
        }


        if(!colunas[status]){
            return;
        }


        colunas[status]
            .insertAdjacentHTML(
                "beforeend",
                criarCard(pedido)
            );

    });


    Object.keys(colunas)
        .forEach(status=>{

            if(
                colunas[status]
                .children.length === 0
            ){

                colunas[status].innerHTML =
                    `<div class="empty">
                        Nenhum pedido aqui.
                    </div>`;

            }

        });


    atualizarContadores(contagens);

}


/* =====================================================
   CONTADORES
===================================================== */

function atualizarContadores(c){

    document.getElementById("statNovo")
        .textContent = c.novo;

    document.getElementById("statAceito")
        .textContent = c.aceito;

    document.getElementById("statPreparando")
        .textContent = c.preparando;

    document.getElementById("statPronto")
        .textContent = c.pronto;

    document.getElementById("statEntregue")
        .textContent = c.entregue;


    document.getElementById("countNovo")
        .textContent = c.novo;

    document.getElementById("countAceito")
        .textContent = c.aceito;

    document.getElementById("countPreparando")
        .textContent = c.preparando;

    document.getElementById("countPronto")
        .textContent = c.pronto;

    document.getElementById("countEntrega")
        .textContent = c.saiu_entrega;

}


/* =====================================================
   CARD
===================================================== */

function criarCard(pedido){

    const status =
        normalizarStatus(pedido.status);


    const novo =
        status === "novo"
            ? "new-order"
            : "";


    const numero =
        pedido.numero_pedido ||
        "#" +
        String(pedido.id || 0)
            .padStart(4,"0");


    const hora =
        pedido.criado_em
            ? new Date(
                pedido.criado_em
              ).toLocaleTimeString(
                "pt-BR",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
              )
            : "";


    let itens = [];

    try{

        if(Array.isArray(pedido.itens)){
            itens = pedido.itens;
        }else if(typeof pedido.itens === "string"){
            itens = JSON.parse(pedido.itens);
        }

    }catch(e){

        console.error(
            "Erro ao ler itens:",
            e
        );

    }


    const itensHTML =
        itens.length
        ?
        itens.map(item=>`

            <div class="item">

                <span class="item-name">
                    ${escapeHTML(
                        item.quantidade || 1
                    )}x
                    ${escapeHTML(
                        item.nome || "Produto"
                    )}
                </span>

                <span class="item-price">
                    ${dinheiro(
                        Number(item.preco || 0) *
                        Number(item.quantidade || 1)
                    )}
                </span>

            </div>

        `).join("")
        :
        `
        <div class="item">
            <span class="item-name">
                Nenhum item informado.
            </span>
        </div>
        `;


    let enderecoHTML = "";


    if(
        pedido.tipo_entrega === "Entrega"
    ){

        enderecoHTML = `

            <div class="address">

                ${escapeHTML(pedido.endereco)}
                ${pedido.numero
                    ? ", " +
                      escapeHTML(pedido.numero)
                    : ""}

                ${pedido.bairro
                    ? " - " +
                      escapeHTML(pedido.bairro)
                    : ""}

                ${pedido.complemento
                    ? "<br>" +
                      escapeHTML(pedido.complemento)
                    : ""}

                ${pedido.referencia
                    ? "<br>Ref.: " +
                      escapeHTML(pedido.referencia)
                    : ""}

            </div>

        `;

    }


    const pagamento = `

        <div class="payment">

            Pagamento:
            <strong>
                ${escapeHTML(
                    pedido.pagamento ||
                    "Não informado"
                )}
            </strong>

            ${
                pedido.troco
                ?
                `<br>
                 Troco:
                 <strong>
                    ${escapeHTML(
                        pedido.troco
                    )}
                 </strong>`
                :
                ""
            }

        </div>

    `;


    const observacoes =
        pedido.observacoes
        ?
        `
        <div class="notes">

            <strong>Observação:</strong><br>

            ${escapeHTML(
                pedido.observacoes
            )}

        </div>
        `
        :
        "";


    return `

        <article
            class="order ${novo}"
            onclick="abrirDetalhes(${pedido.id})">

            <div class="order-head">

                <div>

                    <div class="order-number">
                        ${escapeHTML(numero)}
                    </div>

                    <div class="order-time">
                        ${hora}
                    </div>

                </div>

                <div class="order-total">
                    ${dinheiro(pedido.total)}
                </div>

            </div>


            <div class="order-body">

                <div class="customer">

                    <div class="customer-name">
                        ${escapeHTML(
                            pedido.cliente_nome ||
                            "Cliente"
                        )}
                    </div>

                    <div class="customer-phone">
                        ${escapeHTML(
                            pedido.telefone ||
                            "Telefone não informado"
                        )}
                    </div>

                    <span class="delivery-tag">
                        ${escapeHTML(
                            pedido.tipo_entrega ||
                            "Entrega"
                        )}
                    </span>

                </div>


                <div class="items">

                    ${itensHTML}

                </div>


                ${enderecoHTML}

                ${pagamento}

                ${observacoes}

            </div>


            <div
                class="order-actions"
                onclick="event.stopPropagation()">

                ${botoesPedido(pedido)}

            </div>

        </article>

    `;

}


/* =====================================================
   BOTÕES
===================================================== */

function botoesPedido(pedido){

    const status =
        normalizarStatus(pedido.status);


    if(status === "novo"){

        return `

            <button
                class="action accept"
                onclick="alterarStatus(${pedido.id},'aceito')">
                Aceitar
            </button>

            <button
                class="action reject"
                onclick="alterarStatus(${pedido.id},'cancelado')">
                Recusar
            </button>

        `;

    }


    if(status === "aceito"){

        return `

            <button
                class="action prepare"
                onclick="alterarStatus(${pedido.id},'preparando')">
                Iniciar preparo
            </button>

            <button
                class="action reject"
                onclick="alterarStatus(${pedido.id},'cancelado')">
                Cancelar
            </button>

        `;

    }


    if(status === "preparando"){

        return `

            <button
                class="action ready"
                onclick="alterarStatus(${pedido.id},'pronto')">
                Marcar pronto
            </button>

        `;

    }


    if(status === "pronto"){

        if(
            pedido.tipo_entrega === "Retirada"
        ){

            return `

                <button
                    class="action complete"
                    onclick="alterarStatus(${pedido.id},'entregue')">
                    Pedido retirado
                </button>

            `;

        }


        return `

            <button
                class="action delivery"
                onclick="alterarStatus(${pedido.id},'saiu_entrega')">
                Saiu para entrega
            </button>

        `;

    }


    if(status === "saiu_entrega"){

        return `

            <button
                class="action complete"
                onclick="alterarStatus(${pedido.id},'entregue')">
                Marcar entregue
            </button>

        `;

    }


    return "";

}


/* =====================================================
   ALTERAR STATUS
===================================================== */

async function alterarStatus(id,status){

    const pedido =
        pedidos.find(
            p => Number(p.id) === Number(id)
        );


    if(!pedido){
        return;
    }


    const confirmacao =
        status === "cancelado"
        ? confirm(
            "Tem certeza que deseja recusar este pedido?"
          )
        : true;


    if(!confirmacao){
        return;
    }


    try{

        const resposta = await fetch(
            `${SUPABASE_URL}/rest/v1/pedidos?id=eq.${id}`,
            {
                method:"PATCH",

                headers:{
                    "Content-Type":
                        "application/json",

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`,

                    "Prefer":
                        "return=minimal"
                },

                body:JSON.stringify({
                    status:status
                })

            }
        );


        if(!resposta.ok){

            const erro =
                await resposta.text();

            console.error(erro);

            mostrarToast(
                "Não foi possível atualizar o pedido."
            );

            return;
        }


        pedido.status = status;

        renderPedidos();

        mostrarToast(
            "Pedido atualizado."
        );


    }catch(erro){

        console.error(erro);

        mostrarToast(
            "Erro de conexão."
        );

    }

}


/* =====================================================

/* =====================================================
   REALTIME
===================================================== */

/*
  Usa o endpoint de realtime do Supabase
  para manter o painel sincronizado.
*/

function iniciarRealtime(){

    try{

        const wsUrl =
            SUPABASE_URL
                .replace("https://","wss://")
            +
            "/realtime/v1/websocket?apikey="
            +
            encodeURIComponent(SUPABASE_KEY)
            +
            "&vsn=1.0.0";


        const socket =
            new WebSocket(wsUrl);


        socket.onopen = function(){

            document
                .querySelector(".status-dot")
                .style.background =
                "#36c76f";


            socket.send(
                JSON.stringify({
                    topic:
                        "realtime:pedidos",
                    event:"phx_join",
                    payload:{
                        config:{
                            broadcast:{
                                self:false
                            },
                            presence:{
                            },
                            postgres_changes:[
                                {
                                    event:"*",
                                    schema:"public",
                                    table:"pedidos"
                                }
                            ]
                        }
                    },
                    ref:"1"
                })
            );

        };


        socket.onmessage =
            function(event){

                try{

                    const mensagem =
                        JSON.parse(
                            event.data
                        );


                    if(
                        mensagem.event ===
                        "postgres_changes"
                    ){

                        carregarPedidos();

                    }

                }catch(e){

                    console.error(e);

                }

            };


        socket.onclose = function(){

            document
                .querySelector(".status-dot")
                .style.background =
                "#e05252";


            setTimeout(
                iniciarRealtime,
                5000
            );

        };


    }catch(e){

        console.error(e);

    }

}


/* =====================================================
   INICIAR
===================================================== */

carregarPedidos();

iniciarRealtime();

</script>
