<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Painel | VF FILHOS LANCHES</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#0b0b0b;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}

header{
background:#111;
border-bottom:1px solid #292929;
padding:14px 18px;
position:sticky;
top:0;
z-index:20;
}

.header{
max-width:1400px;
margin:auto;
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:48px;
height:48px;
border-radius:50%;
border:2px solid #d4a72c;
object-fit:cover;
}

.title{
flex:1;
}

.title h1{
margin:0;
font-size:19px;
color:#f1c85b;
}

.title span{
font-size:12px;
color:#999;
}

.refresh{
background:#d4a72c;
border:0;
border-radius:10px;
padding:10px 13px;
font-weight:bold;
}

main{
max-width:1400px;
margin:auto;
padding:20px;
}

.stats{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
margin-bottom:20px;
}

.stat{
background:#151515;
border:1px solid #292929;
border-radius:14px;
padding:14px;
}

.stat strong{
display:block;
font-size:25px;
color:#f1c85b;
}

.stat span{
font-size:12px;
color:#999;
}

.board{
display:grid;
grid-template-columns:repeat(4,minmax(260px,1fr));
gap:14px;
overflow-x:auto;
}

.column{
background:#111;
border:1px solid #292929;
border-radius:15px;
min-height:300px;
padding:10px;
}

.column h2{
font-size:14px;
margin:5px;
color:#f1c85b;
}

.order{
background:#1a1a1a;
border:1px solid #303030;
border-radius:13px;
padding:13px;
margin:9px 0;
}

.order.new{
border-color:#d4a72c;
box-shadow:0 0 0 1px #d4a72c22;
}

.order-head{
display:flex;
justify-content:space-between;
gap:8px;
}

.number{
font-size:19px;
font-weight:bold;
color:#f1c85b;
}

.time{
font-size:11px;
color:#999;
}

.customer{
margin:9px 0;
font-weight:bold;
}

.items{
border-top:1px solid #303030;
border-bottom:1px solid #303030;
padding:9px 0;
font-size:13px;
line-height:1.5;
}

.info{
font-size:12px;
color:#bbb;
line-height:1.5;
margin-top:9px;
}

.total{
display:flex;
justify-content:space-between;
font-weight:bold;
margin-top:10px;
}

.actions{
display:grid;
gap:7px;
margin-top:11px;
}

.action{
border:0;
border-radius:9px;
padding:10px;
font-weight:bold;
background:#d4a72c;
color:#000;
}

.cancel{
background:#42191c;
color:#ff8f8f;
border:1px solid #7a292d;
}

.empty{
text-align:center;
color:#666;
padding:25px 5px;
font-size:12px;
}

.modal{
position:fixed;
inset:0;
z-index:100;
background:#000b;
display:none;
align-items:center;
justify-content:center;
padding:15px;
}

.modal.open{
display:flex;
}

.modal-box{
background:#151515;
border:1px solid #333;
border-radius:16px;
width:min(600px,100%);
max-height:90vh;
overflow:auto;
padding:20px;
}

.close{
float:right;
background:#333;
color:white;
border:0;
border-radius:8px;
padding:8px;
}

@media(max-width:900px){

.stats{
grid-template-columns:repeat(2,1fr);
}

.board{
grid-template-columns:repeat(4,280px);
}

}

</style>

</head>

<body>

<header>

<div class="header">

<img
src="logo-vf.jpg"
class="logo">

<div class="title">

<h1>
VF FILHOS LANCHES
</h1>

<span>
Painel de pedidos
</span>

</div>

<button
class="refresh"
onclick="loadOrders()">

↻ Atualizar

</button>

</div>

</header>


<main>

<div
id="stats"
class="stats">
</div>


<div
id="board"
class="board">

</div>

</main>


<div
id="modal"
class="modal">

<div
id="modalBox"
class="modal-box">

</div>

</div>


<script>

const SUPABASE_URL=
"https://zjfgmokdcwzwpoancpgr.supabase.co";

const SUPABASE_KEY=
"sb_publishable_XSySYoAnL4D2xydCg98Lrg_JWB4ulQL";

const supabaseClient=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const columns=[

{
status:"novo",
title:"🔔 NOVOS"
},

{
status:"aceito",
title:"✓ ACEITOS"
},

{
status:"em_preparo",
title:"👨‍🍳 EM PREPARO"
},

{
status:"pronto",
title:"📦 PRONTOS"
}

];


const extraColumns=[

{
status:"saiu_entrega",
title:"🛵 EM ENTREGA"
},

{
status:"entregue",
title:"✓ FINALIZADOS"
}

];


let orders=[];


function money(v){

return Number(v||0).toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);

}


function dateTime(v){

return new Date(v)
.toLocaleString(
"pt-BR",
{
dateStyle:"short",
timeStyle:"short"
}
);

}


async function loadOrders(){

const {data,error}=
await supabaseClient

.from("pedidos")

.select("*")

.order(
"criado_em",
{
ascending:false
}
);


if(error){

console.error(error);

alert(
"Erro ao carregar pedidos:\n"+
error.message
);

return;

}


orders=data||[];

render();

}


function renderStats(){

const novo=
orders.filter(
x=>x.status==="novo"
).length;

const preparo=
orders.filter(
x=>x.status==="em_preparo"
).length;

const pronto=
orders.filter(
x=>x.status==="pronto"
).length;

const entrega=
orders.filter(
x=>x.status==="saiu_entrega"
).length;

const total=
orders.filter(
x=>x.status!=="cancelado"
).length;


document
.getElementById("stats")
.innerHTML=

`

<div class="stat">

<strong>
${novo}
</strong>

<span>
Novos
</span>

</div>

<div class="stat">

<strong>
${preparo}
</strong>

<span>
Em preparo
</span>

</div>

<div class="stat">

<strong>
${pronto}
</strong>

<span>
Prontos
</span>

</div>

<div class="stat">

<strong>
${entrega}
</strong>

<span>
Em entrega
</span>

</div>

<div class="stat">

<strong>
${total}
</strong>

<span>
Pedidos
</span>

</div>

`;

}


function render(){

renderStats();


document
.getElementById("board")
.innerHTML=

[...columns,...extraColumns]

.map(
column=>{

const list=
orders.filter(
o=>o.status===column.status
);


return `

<section class="column">

<h2>
${column.title}
(${list.length})
</h2>

${list.length
?list.map(orderCard).join("")
:`
<div class="empty">
Nenhum pedido
</div>
`}

</section>

`;

}).join("");

}


function orderCard(order){

const items=
Array.isArray(order.itens)
?order.itens
:[];


return `

<article
class="order ${
order.status==="novo"
?"new"
:""
}">

<div class="order-head">

<div class="number">

${order.numero_pedido || "#"+order.id}

</div>

<div class="time">

${dateTime(order.criado_em)}

</div>

</div>


<div class="customer">

${escapeHtml(order.cliente_nome)}

</div>


<div class="items">

${items.map(
i=>`

<div>

<b>
${i.quantidade}x
</b>

${escapeHtml(i.nome)}

—

${money(i.subtotal)}

</div>

`).join("")}

</div>


<div class="info">

<b>Tipo:</b>
${escapeHtml(order.tipo_entrega)}

<br>

<b>Pagamento:</b>
${escapeHtml(order.pagamento||"-")}

${order.troco
?`<br><b>Troco:</b> ${escapeHtml(order.troco)}`
:""}

${order.tipo_entrega==="Entrega"
?`

<br><br>

<b>Endereço:</b>

${escapeHtml(order.endereco||"")},

${escapeHtml(order.numero||"")}

${order.complemento
?", "+escapeHtml(order.complemento)
:""}

<br>

${escapeHtml(order.bairro||"")}

${order.referencia
?`<br><b>Ref.:</b> ${escapeHtml(order.referencia)}`
:""}

`
:""}

${order.observacoes
?`

<br><br>

<b>Observações:</b>

${escapeHtml(order.observacoes)}

`
:""}

</div>


<div class="total">

<span>
Total
</span>

<span>
${money(order.total)}
</span>

</div>


<div class="actions">

${actions(order)}

</div>

</article>

`;

}


function actions(order){

if(order.status==="novo"){

return `

<button
class="action"
onclick="updateStatus(${order.id},'aceito')">

✓ Aceitar pedido

</button>

<button
class="action cancel"
onclick="updateStatus(${order.id},'cancelado')">

✕ Recusar pedido

</button>

`;

}


if(order.status==="aceito"){

return `

<button
class="action"
onclick="updateStatus(${order.id},'em_preparo')">

👨‍🍳 Iniciar preparo

</button>

<button
class="action cancel"
onclick="updateStatus(${order.id},'cancelado')">

✕ Cancelar

</button>

`;

}


if(order.status==="em_preparo"){

return `

<button
class="action"
onclick="updateStatus(${order.id},'pronto')">

📦 Marcar como pronto

</button>

`;

}


if(order.status==="pronto"){

if(order.tipo_entrega==="Retirada"){

return `

<button
class="action"
onclick="updateStatus(${order.id},'retirada')">

✓ Cliente retirou

</button>

`;

}

return `

<button
class="action"
onclick="updateStatus(${order.id},'saiu_entrega')">

🛵 Saiu para entrega

</button>

`;

}


if(order.status==="saiu_entrega"){

return `

<button
class="action"
onclick="updateStatus(${order.id},'entregue')">

✓ Marcar como entregue

</button>

`;

}


return "";

}


async function updateStatus(id,status){

const {error}=
await supabaseClient

.from("pedidos")

.update({
status:status
})

.eq("id",id);


if(error){

alert(
"Erro ao atualizar pedido:\n"+
error.message
);

return;

}

await loadOrders();

}


function escapeHtml(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* TEMPO REAL */

supabaseClient

.channel("painel-pedidos")

.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"pedidos"
},
payload=>{

if(
payload.eventType==="INSERT"
){

try{
new Audio(
"data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQAAAAA="
).play();
}catch(e){}

}

loadOrders();

}
)

.subscribe();


loadOrders();

</script>

</body>

</html>
