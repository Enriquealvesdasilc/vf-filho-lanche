<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel | VF FILHOS LANCHES</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#050505;
    --panel:#0c0c0c;
    --panel2:#111;
    --border:#292929;
    --gold:#d4af37;
    --gold2:#b8941f;
    --text:#fff;
    --muted:#999;
    --green:#36c76f;
    --red:#e05252;
    --blue:#4da3ff;
    --orange:#e7a93d;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

.header{
    position:sticky;
    top:0;
    z-index:1000;
    min-height:72px;
    background:#070707;
    border-bottom:1px solid var(--gold2);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 22px;
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo{
    width:125px;
    max-height:55px;
    object-fit:contain;
}

.brand-title{
    border-left:1px solid #333;
    padding-left:15px;
}

.brand-title strong{
    display:block;
    color:var(--gold);
    font-size:15px;
}

.brand-title span{
    display:block;
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-btn{
    background:#111;
    border:1px solid #333;
    color:#fff;
    border-radius:9px;
    min-height:40px;
    padding:0 14px;
    cursor:pointer;
}

.header-btn:hover{
    border-color:var(--gold);
    color:var(--gold);
}

.header-btn.sound-on{
    border-color:var(--gold);
    color:var(--gold);
}

.status-online{
    display:flex;
    align-items:center;
    gap:7px;
    color:#aaa;
    font-size:12px;
}

.status-dot{
    width:9px;
    height:9px;
    background:var(--green);
    border-radius:50%;
    box-shadow:0 0 8px rgba(54,199,111,.6);
}

.main{
    max-width:1600px;
    margin:auto;
    padding:24px;
}

.top-area{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    margin-bottom:22px;
}

.page-title h1{
    font-size:28px;
    color:#fff;
}

.page-title p{
    margin-top:6px;
    color:var(--muted);
    font-size:14px;
}

.date-box{
    color:var(--muted);
    font-size:13px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:13px;
    margin-bottom:22px;
}

.stat{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:13px;
    padding:17px;
}

.stat:hover{
    border-color:#5b4c1d;
}

.stat-label{
    color:var(--muted);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.5px;
}

.stat-number{
    color:#fff;
    font-size:28px;
    font-weight:bold;
    margin-top:8px;
}

.stat.gold .stat-number{
    color:var(--gold);
}

.stat.green .stat-number{
    color:var(--green);
}

.stat.orange .stat-number{
    color:var(--orange);
}

.stat.blue .stat-number{
    color:var(--blue);
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search{
    flex:1;
}

.search input,
.filter select{
    width:100%;
    height:45px;
    background:#0e0e0e;
    border:1px solid #303030;
    border-radius:9px;
    color:#fff;
    padding:0 13px;
    outline:none;
}

.search input:focus,
.filter select:focus{
    border-color:var(--gold);
}

.filter{
    width:200px;
}

.board{
    display:grid;
    grid-template-columns:repeat(5,minmax(260px,1fr));
    gap:14px;
    overflow-x:auto;
    padding-bottom:10px;
}

.column{
    background:#080808;
    border:1px solid var(--border);
    border-radius:14px;
    min-height:500px;
    overflow:hidden;
}

.column-header{
    padding:15px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.column-title{
    display:flex;
    align-items:center;
    gap:9px;
    font-weight:bold;
    font-size:14px;
}

.column-count{
    min-width:25px;
    height:25px;
    padding:0 7px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:20px;
    background:#191919;
    color:var(--gold);
    font-size:12px;
}

.column-body{
    padding:10px;
}

.order{
    background:var(--panel);
    border:1px solid #242424;
    border-radius:11px;
    margin-bottom:10px;
    overflow:hidden;
}

.order:hover{
    border-color:#65541f;
}

.order.new-order{
    border-color:var(--gold);
    box-shadow:0 0 0 1px rgba(212,175,55,.1);
}

.order-head{
    padding:13px;
    border-bottom:1px solid #202020;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.order-number{

.order-time{

.order-total{

}

.order-body{

}

.customer{

}

.customer-name{
    font-weight:bold;
    font-size:14px;
}

.customer-phone{
    color:#999;
    font-size:12px;

}

.delivery-tag{

.items{

.item{

.item-name{

.address{

.payment{

.prepare{

.ready{

.delivery{

.complete{

.modal-box{

.modal-head{

    align-items:center;

.modal-head h2{

.close{

}

.detail-section{
    margin-bottom:17px;
}

.detail-section h3{
    color:var(--gold);
    font-size:13px;
    margin-bottom:8px;
    text-transform:uppercase;
}

.detail-box{

    border-radius:9px;

    color:#bbb;
    font-size:13px;

}

.detail-item{

    justify-content:space-between;

.detail-item:last-child{

.modal-total{

    padding-top:14px;

.modal-total span:last-child{

}

.toast{
    position:fixed;
    right:25px;
    bottom:25px;
    background:var(--gold);
    color:#000;
    padding:13px 18px;
    border-radius:8px;
    font-weight:bold;
    font-size:13px;
    transform:translateY(100px);
    opacity:0;
    transition:.25s;
    z-index:5000;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* AVISO DE NOVO PEDIDO */

.new-order-alert{
    position:fixed;
    top:90px;
    right:25px;
    z-index:4500;
    width:min(390px,calc(100% - 30px));
    background:#0d0d0d;
    border:2px solid var(--gold);
    border-radius:14px;
    padding:16px;
    box-shadow:0 10px 40px rgba(0,0,0,.6);
    display:none;
}

.new-order-alert.show{
    display:block;
    animation:alertIn .3s ease;
}

.new-order-alert-title{
    color:var(--gold);
    font-size:18px;
    font-weight:bold;
}

.new-order-alert-text{
    color:#ccc;
    font-size:13px;
    margin-top:6px;
}

.new-order-alert button{
    margin-top:12px;
    width:100%;
    height:40px;
    border:0;
    border-radius:8px;
    background:var(--gold);
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

@keyframes alertIn{
    from{
        opacity:0;
        transform:translateY(-15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* DESTAQUE DE PEDIDO NOVO */

@keyframes pulseOrder{
    0%,100%{
        box-shadow:0 0 0 1px rgba(212,175,55,.15);
    }
    50%{
        box-shadow:0 0 0 3px rgba(212,175,55,.4);
    }
}

.order.new-order{
    animation:pulseOrder 1.5s infinite;
}

@media(max-width:1100px){

    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .board{
        grid-template-columns:repeat(5,280px);
    }

}

@media(max-width:700px){

    .header{
        padding:8px 12px;
    }

    .brand-title{
        display:none;
    }

    .logo{
        width:105px;
    }

    .main{
        padding:16px 12px;
    }

    .top-area{
        align-items:flex-start;
        flex-direction:column;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .toolbar{
        flex-direction:column;
    }

    .filter{
        width:100%;
    }

    .board{
        grid-template-columns:repeat(5,285px);
        overflow-x:auto;
    }

    .status-online{
        display:none;
    }

    .header-actions{
        gap:5px;
    }

    .header-btn{
        padding:0 9px;
        font-size:11px;
    }

    .new-order-alert{
        top:80px;
        right:15px;
    }

}

</style>
</head>

<body>

<header class="header">

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://zjfgmokdcwzwpoancpgr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XSySYoAnL4D2xydCg98Lrg_JWB4ulQL";


/* =====================================================
   ESTADO
===================================================== */

let pedidos = [];

let audioContext = null;

let somAtivado = false;

let ultimoPedidoAvisado = null;

let avisoTimeout = null;


/* =====================================================
   SOM
===================================================== */

function ativarSom(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }

        somAtivado = true;


        const botao =
            document.getElementById(
                "soundBtn"
            );


        botao.textContent =
            "🔊 Som ativado";


        botao.classList.add(
            "sound-on"
        );


        mostrarToast(
            "Som de novos pedidos ativado."
        );


        /*
         * Toca um pequeno teste
         * para liberar o áudio do navegador.
         */

        tocarSomNovoPedido();


    }catch(erro){

        console.error(
            "Erro ao ativar som:",
            erro
        );

        mostrarToast(
            "Não foi possível ativar o som."
        );

    }

}


function tocarSomNovoPedido(){

    if(!somAtivado){
        return;
    }


    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }


        const agora =
            audioContext.currentTime;


        /*
         * Toque curto e profissional.
         * Duração total aproximada: 1,9 segundos.
         */

        const notas = [

            {
                tempo:0,
                frequencia:880,
                duracao:.32
            },

            {
                tempo:.30,
                frequencia:1174.66,
                duracao:.32
            },

            {
                tempo:.60,
                frequencia:1396.91,
                duracao:.40
            },

            {
                tempo:1.00,
                frequencia:1174.66,
                duracao:.32
            },

            {
                tempo:1.32,
                frequencia:1567.98,
                duracao:.48
            }

        ];


        notas.forEach(nota=>{

            const oscilador =
                audioContext.createOscillator();


            const ganho =
                audioContext.createGain();


            oscilador.type =
                "sine";


            oscilador.frequency.value =
                nota.frequencia;


            ganho.gain.setValueAtTime(
                0,
                agora + nota.tempo
            );


            ganho.gain.linearRampToValueAtTime(
                0.18,
                agora +
                nota.tempo +
                .04
            );


            ganho.gain.exponentialRampToValueAtTime(
                0.001,
                agora +
                nota.tempo +
                nota.duracao
            );


            oscilador.connect(
                ganho
            );


            ganho.connect(
                audioContext.destination
            );


            oscilador.start(
                agora +
                nota.tempo
            );


            oscilador.stop(
                agora +
                nota.tempo +
                nota.duracao
            );

        });


    }catch(erro){

        console.error(
            "Erro no som:",
            erro
        );

    }

}


/* =====================================================
   VERIFICAR NOVO PEDIDO
===================================================== */

function verificarNovoPedido(lista){

    if(
        !somAtivado ||
        !Array.isArray(lista)
    ){

        return;

    }


    const novos =
        lista.filter(
            pedido =>
                String(
                    pedido.status ||
                    "novo"
                ) === "novo"
        );


    if(!novos.length){
        return;
    }


    /*
     * Supabase retorna por criado_em desc,
     * portanto o primeiro é o mais recente.
     */

    const maisRecente =
        novos[0];


    const idAtual =
        String(
            maisRecente.id ||
            maisRecente.numero_pedido ||
            ""
        );


    if(!idAtual){
        return;
    }


    /*
     * Primeira leitura:
     * não toca.
     *
     * Isso evita o painel tocar todos
     * os pedidos antigos ao ser aberto.
     */

    if(
        ultimoPedidoAvisado === null
    ){

        ultimoPedidoAvisado =
            idAtual;

        return;

    }


    /*
     * Só toca quando aparecer um pedido
     * realmente diferente.
     */

    if(
        ultimoPedidoAvisado !==
        idAtual
    ){

        ultimoPedidoAvisado =
            idAtual;


        tocarSomNovoPedido();


        mostrarAvisoNovoPedido(
            maisRecente
        );

    }

}

/* =====================================================
   FORMATADORES
===================================================== */

function dinheiro(valor){

    return Number(valor || 0)
        .toLocaleString(
            "pt-BR",
            {
                style:"currency",
                currency:"BRL"
            }
        );

}


function escapeHTML(valor){

    if(
        valor === null ||
        valor === undefined
    ){

        return "";

    }


    return String(valor)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


function mostrarToast(texto){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        texto;


    toast.classList.add(
        "show"
    );


    setTimeout(
        ()=>{
            toast.classList.remove(
                "show"
            );
        },
        2500
    );

}

/* =====================================================
   BUSCAR PEDIDOS
===================================================== */

async function carregarPedidos(){

    try{

        const resposta =
            await fetch(
                `${SUPABASE_URL}/rest/v1/pedidos?select=*&order=criado_em.desc`,
                {
                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`
                    }
                }
            );


        if(!resposta.ok){

            const erro =
                await resposta.text();


            console.error(
                erro
            );


            mostrarToast(
                "Erro ao carregar pedidos."
            );


            return;

        }


        const novosPedidos =
            await resposta.json();


        /*
         * Verifica o som antes de substituir
         * a lista atual.
         */

        verificarNovoPedido(
            novosPedidos
        );


        pedidos =
            novosPedidos;


        renderPedidos();


    }catch(erro){

        console.error(
            erro
        );


        mostrarToast(
            "Erro de conexão com o servidor."
        );

    }

}


/* =====================================================
   FILTROS
===================================================== */

function pedidoVisivel(pedido){

    const busca =
        document
        .getElementById(
            "search"
        )
        .value
        .trim()
        .toLowerCase();


    const filtro =
        document
        .getElementById(
            "statusFilter"
        )
        .value;


    if(
        filtro !== "todos" &&
        pedido.status !== filtro
    ){

        return false;

    }


    if(!busca){
        return true;
    }


    const numero =
        String(
            pedido.numero_pedido ||
            pedido.id ||
            ""
        ).toLowerCase();


    const nome =
        String(
            pedido.cliente_nome ||
            ""
        ).toLowerCase();


    const telefone =
        String(
            pedido.telefone ||
            ""
        ).toLowerCase();


    return(
        numero.includes(busca) ||
        nome.includes(busca) ||
        telefone.includes(busca)
    );

}


/* =====================================================
   STATUS
===================================================== */

function normalizarStatus(status){

    return status ||
        "novo";

}


/* =====================================================
   RENDER
===================================================== */

function renderPedidos(){

    const colunas = {

        novo:
            document.getElementById(
                "colNovo"
            ),

        aceito:
            document.getElementById(
                "colAceito"
            ),

        preparando:
            document.getElementById(
                "colPreparando"
            ),

        pronto:
            document.getElementById(
                "colPronto"
            ),

        saiu_entrega:
            document.getElementById(
                "colEntrega"
            )

    };


    Object.values(colunas)
        .forEach(
            coluna=>{
                coluna.innerHTML =
                    "";
            }
        );


    const contagens = {

        novo:0,

        aceito:0,

        preparando:0,

        pronto:0,

        saiu_entrega:0,

        entregue:0,

        cancelado:0

    };


    pedidos.forEach(
        pedido=>{

            const status =
                normalizarStatus(
                    pedido.status
                );


            if(
                contagens[status]
                !== undefined
            ){

                contagens[status]++;

            }


            if(
                !pedidoVisivel(
                    pedido
                )
            ){

                return;

            }


            if(
                !colunas[status]
            ){

                return;

            }


            colunas[status]
                .insertAdjacentHTML(
                    "beforeend",
                    criarCard(
                        pedido
                    )
                );

        }
    );


    Object.keys(colunas)
        .forEach(
            status=>{

                if(
                    colunas[status]
                    .children
                    .length === 0
                ){

                    colunas[status]
                        .innerHTML =
                        `<div class="empty">
                            Nenhum pedido aqui.
                        </div>`;

                }

            }
        );


    atualizarContadores(
        contagens
    );

}

    document.getElementById(

/* =====================================================
   CARD
===================================================== */

function criarCard(pedido){

    const status =
        normalizarStatus(
            pedido.status
        );


    const novo =
        status === "novo"
        ? "new-order"
        : "";


    const numero =
        pedido.numero_pedido ||
        "#" +
        String(
            pedido.id ||
            0
        ).padStart(
            4,
            "0"
        );


    const hora =
        pedido.criado_em
        ?
        new Date(
            pedido.criado_em
        ).toLocaleTimeString(
            "pt-BR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        )
        :
        "";


    let itens = [];


    try{

        if(
            Array.isArray(
                pedido.itens
            )
        ){

            itens =
                pedido.itens;

        }else if(
            typeof pedido.itens ===
            "string"
        ){

            itens =
                JSON.parse(
                    pedido.itens
                );

        }

    }catch(e){

        console.error(
            "Erro ao ler itens:",
            e
        );

    }


    const itensHTML =
        itens.length
        ?
        itens.map(
            item=>`

            <div class="item">

                <span class="item-name">

                    ${escapeHTML(
                        item.quantidade ||
                        1
                    )}x

                    ${escapeHTML(
                        item.nome ||
                        "Produto"
                    )}

                </span>

                <span class="item-price">

                    ${dinheiro(
                        Number(
                            item.preco ||
                            0
                        ) *
                        Number(
                            item.quantidade ||
                            1
                        )
                    )}

                </span>

            </div>

        `
        ).join("")
        :
        `
        <div class="item">
            <span class="item-name">
                Nenhum item informado.
            </span>
        </div>
        `;


    let enderecoHTML =
        "";


    if(
        pedido.tipo_entrega ===
        "Entrega"
    ){

        enderecoHTML = `

            <div class="address">

                ${escapeHTML(
                    pedido.endereco
                )}

                ${
                    pedido.numero
                    ?
                    ", " +
                    escapeHTML(
                        pedido.numero
                    )
                    :
                    ""
                }

                ${
                    pedido.bairro
                    ?
                    " - " +
                    escapeHTML(
                        pedido.bairro
                    )
                    :
                    ""
                }

                ${
                    pedido.complemento
                    ?
                    "<br>" +
                    escapeHTML(
                        pedido.complemento
                    )
                    :
                    ""
                }

                ${
                    pedido.referencia
                    ?
                    "<br>Ref.: " +
                    escapeHTML(
                        pedido.referencia
                    )
                    :
                    ""
                }

            </div>

        `;

    }


    const pagamento = `

        <div class="payment">

            Pagamento:

            <strong>

                ${escapeHTML(
                    pedido.pagamento ||
                    "Não informado"
                )}

            </strong>

            ${
                pedido.troco
                ?
                `<br>
                Troco:
                <strong>
                    ${escapeHTML(
                        pedido.troco
                    )}
                </strong>`
                :
                ""
            }

        </div>

    `;


    const observacoes =
        pedido.observacoes
        ?
        `
        <div class="notes">

            <strong>
                Observação:
            </strong>

            <br>

            ${escapeHTML(
                pedido.observacoes
            )}

        </div>
        `
        :
        "";


    return `

        <article
            class="order ${novo}"
            onclick="abrirDetalhes(
                ${pedido.id}
            )">

            <div class="order-head">

                <div>

                    <div class="order-number">

                        ${escapeHTML(
                            numero
                        )}

                    </div>

                    <div class="order-time">

                        ${hora}

                    </div>

                </div>

                <div class="order-total">

                    ${dinheiro(
                        pedido.total
                    )}

                </div>

            </div>


            <div class="order-body">

                <div class="customer">

                    <div class="customer-name">

                        ${escapeHTML(
                            pedido.cliente_nome ||
                            "Cliente"
                        )}

                    </div>

                    <div class="customer-phone">

                        ${escapeHTML(
                            pedido.telefone ||
                            "Telefone não informado"
                        )}

                    </div>

                    <span class="delivery-tag">

                        ${escapeHTML(
                            pedido.tipo_entrega ||
                            "Entrega"
                        )}

                    </span>

                </div>


                <div class="items">

                    ${itensHTML}

                </div>


                ${enderecoHTML}

                ${pagamento}

                ${observacoes}

            </div>


            <div
                class="order-actions"
                onclick="event.stopPropagation()">

                ${botoesPedido(
                    pedido
                )}

            </div>

        </article>

    `;

}


/* =====================================================
   BOTÕES
===================================================== */

function botoesPedido(pedido){

    const status =
        normalizarStatus(
            pedido.status
        );


    if(
        status === "novo"
    ){

        return `

            <button
                class="action accept"
                onclick="alterarStatus(
                    ${pedido.id},
                    'aceito'
                )">

                Aceitar

            </button>

            <button
                class="action reject"
                onclick="alterarStatus(
                    ${pedido.id},
                    'cancelado'
                )">

                Recusar

            </button>

        `;

    }


    if(
        status === "aceito"
    ){

        return `

            <button
                class="action prepare"
                onclick="alterarStatus(
                    ${pedido.id},
                    'preparando'
                )">

                Iniciar preparo

            </button>

            <button
                class="action reject"
                onclick="alterarStatus(
                    ${pedido.id},
                    'cancelado'
                )">

                Cancelar

            </button>

        `;

    }


    if(
        status === "preparando"
    ){

        return `

            <button
                class="action ready"
                onclick="alterarStatus(
                    ${pedido.id},
                    'pronto'
                )">

                Marcar pronto

            </button>

        `;

    }


    if(
        status === "pronto"
    ){

        if(
            pedido.tipo_entrega ===
            "Retirada"
        ){

            return `

                <button
                    class="action complete"
                    onclick="alterarStatus(
                        ${pedido.id},
                        'entregue'
                    )">

                    Pedido retirado

                </button>

            `;

        }


        return `

            <button
                class="action delivery"
                onclick="alterarStatus(
                    ${pedido.id},
                    'saiu_entrega'
                )">

                Saiu para entrega

            </button>

        `;

    }


    if(
        status === "saiu_entrega"
    ){

        return `

            <button
                class="action complete"
                onclick="alterarStatus(
                    ${pedido.id},
                    'entregue'
                )">

                Marcar entregue

            </button>

        `;

    }


    return "";

}


/* =====================================================
   ALTERAR STATUS
===================================================== */

async function alterarStatus(
    id,
    status
){

    const pedido =
        pedidos.find(
            p =>
                Number(p.id) ===
                Number(id)
        );


    if(!pedido){
        return;
    }


    const confirmacao =
        status === "cancelado"
        ?
        confirm(
            "Tem certeza que deseja recusar este pedido?"
        )
        :
        true;


    if(!confirmacao){
        return;
    }


    try{

        const resposta =
            await fetch(
                `${SUPABASE_URL}/rest/v1/pedidos?id=eq.${id}`,
                {
                    method:"PATCH",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`,

                        "Prefer":
                            "return=minimal"
                    },

                    body:
                        JSON.stringify({
                            status:
                                status
                        })

                }
            );


        if(!resposta.ok){

            const erro =
                await resposta.text();


            console.error(
                erro
            );


            mostrarToast(
                "Não foi possível atualizar o pedido."
            );


            return;

        }


        pedido.status =
            status;


        renderPedidos();


        mostrarToast(
            "Pedido atualizado."
        );


    }catch(erro){

        console.error(
            erro
        );


        mostrarToast(
            "Erro de conexão."
        );

    }

}

/* =====================================================
   REALTIME
===================================================== */

function iniciarRealtime(){

    try{

        const wsUrl =
            SUPABASE_URL
                .replace(
                    "https://",
                    "wss://"
                )
            +
            "/realtime/v1/websocket?apikey="
            +
            encodeURIComponent(
                SUPABASE_KEY
            )
            +
            "&vsn=1.0.0";


        const socket =
            new WebSocket(
                wsUrl
            );


        socket.onopen =
            function(){

                document
                    .querySelector(
                        ".status-dot"
                    )
                    .style.background =
                    "#36c76f";


                socket.send(
                    JSON.stringify({

                        topic:
                            "realtime:pedidos",

                        event:
                            "phx_join",

                        payload:{
                            config:{
                                broadcast:{
                                    self:false
                                },

                                presence:{},

                                postgres_changes:[
                                    {
                                        event:"*",
                                        schema:"public",
                                        table:"pedidos"
                                    }
                                ]
                            }
                        },

                        ref:"1"

                    })
                );

            };


        socket.onmessage =
            function(event){

                try{

                    const mensagem =
                        JSON.parse(
                            event.data
                        );


                    if(
                        mensagem.event ===
                        "postgres_changes"
                    ){

                        carregarPedidos();

                    }

                }catch(e){

                    console.error(
                        e
                    );

                }

            };


        socket.onerror =
            function(){

                document
                    .querySelector(
                        ".status-dot"
                    )
                    .style.background =
                    "#e05252";

            };


        socket.onclose =
            function(){

                document
                    .querySelector(
                        ".status-dot"
                    )
                    .style.background =
                    "#e05252";


                setTimeout(
                    iniciarRealtime,
                    5000
                );

            };


    }catch(e){

        console.error(
            e
        );

    }

}
