<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VF Filho Lanche</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
      padding-bottom: 90px;
    }

    header {
      background: #111;
      color: white;
      padding: 22px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-content {
      max-width: 900px;
      margin: auto;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 5px;
      color: #ccc;
      font-size: 14px;
    }

    .search {
      margin-top: 18px;
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      outline: none;
    }

    .categories {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 13px;
      background: white;
      position: sticky;
      top: 116px;
      z-index: 9;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      white-space: nowrap;
      border: 1px solid #ddd;
      background: white;
      padding: 9px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
    }

    .category-btn.active {
      background: #111;
      color: white;
      border-color: #111;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 18px 14px;
    }

    .category {
      margin-bottom: 30px;
      scroll-margin-top: 170px;
    }

    .category h2 {
      margin-bottom: 12px;
      font-size: 21px;
    }

    .product {
      background: white;
      border-radius: 15px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .product h3 {
      font-size: 18px;
      margin-bottom: 7px;
    }

    .description {
      color: #666;
      line-height: 1.45;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .product-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .price {
      font-size: 18px;
      font-weight: 800;
    }

    .add {
      border: none;
      background: #111;
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .cart-bar {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 870px;
      background: #111;
      color: white;
      border-radius: 15px;
      padding: 15px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      box-shadow: 0 5px 25px rgba(0,0,0,.3);
      cursor: pointer;
    }

    .cart-count {
      background: white;
      color: #111;
      padding: 3px 8px;
      border-radius: 20px;
      margin-left: 5px;
      font-weight: bold;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 22px 22px 0 0;
      padding: 22px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .close {
      border: none;
      background: #eee;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      font-size: 20px;
      cursor: pointer;
    }

    .cart-item {
      border-bottom: 1px solid #eee;
      padding: 13px 0;
    }

    .cart-item-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 9px;
    }

    .quantity button {
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: #eee;
      font-size: 18px;
      cursor: pointer;
    }

    .total {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: 800;
      padding: 18px 0;
    }

    .form-group {
      margin-top: 13px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    .checkout-btn {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      padding: 35px 10px;
      color: #777;
    }

    .success {
      text-align: center;
      padding: 30px 10px;
    }

    .order-number {
      font-size: 27px;
      font-weight: 900;
      margin: 15px 0;
    }

    .status {
      background: #f2f2f2;
      border-radius: 12px;
      padding: 15px;
      margin-top: 18px;
    }

    .status-step {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    .status-step:last-child {
      border-bottom: none;
    }

    .status-step.active {
      font-weight: bold;
    }

    @media (min-width: 700px) {
      .modal {
        align-items: center;
      }

      .modal-content {
        border-radius: 22px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">VF Filho Lanche 🍔</div>
    <div class="subtitle">Seu lanche, do nosso jeito.</div>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Buscar no cardápio..."
      oninput="renderProducts()"
    >
  </div>
</header>

<nav class="categories">
  <button class="category-btn active" onclick="goTo('hamburgueres', this)">🍔 Hambúrgueres</button>
  <button class="category-btn" onclick="goTo('combos', this)">🍱 Combos</button>
  <button class="category-btn" onclick="goTo('promocoes', this)">🏷️ Promoções</button>
  <button class="category-btn" onclick="goTo('bebidas', this)">🥤 Bebidas</button>
  <button class="category-btn" onclick="goTo('adicionais', this)">➕ Adicionais</button>
  <button class="category-btn" onclick="goTo('porcoes', this)">🍟 Porções</button>
  <button class="category-btn" onclick="goTo('frango', this)">🍗 Frango Assado</button>
</nav>

<main id="menu"></main>

<div class="cart-bar" onclick="openCart()">
  <div>
    🛒 Carrinho
    <span class="cart-count" id="cartCount">0</span>
  </div>
  <strong id="cartTotal">R$ 0,00</strong>
</div>

<div class="modal" id="cartModal">
  <div class="modal-content">

    <div class="modal-header">
      <h2>Seu pedido</h2>
      <button class="close" onclick="closeModal('cartModal')">×</button>
    </div>

    <div id="cartItems"></div>

    <div class="total">
      <span>Total</span>
      <span id="modalTotal">R$ 0,00</span>
    </div>

    <button class="checkout-btn" onclick="openCheckout()">
      Continuar pedido
    </button>

  </div>
</div>

<div class="modal" id="checkoutModal">
  <div class="modal-content">

    <div class="modal-header">
      <h2>Finalizar pedido</h2>
      <button class="close" onclick="closeModal('checkoutModal')">×</button>
    </div>

    <div class="form-group">
      <label>Seu nome</label>
      <input id="customerName" placeholder="Digite seu nome">
    </div>

    <div class="form-group">
      <label>Telefone</label>
      <input id="customerPhone" placeholder="(00) 00000-0000">
    </div>

    <div class="form-group">
      <label>Endereço</label>
      <textarea id="customerAddress" rows="3" placeholder="Rua, número, bairro..."></textarea>
    </div>

    <div class="form-group">
      <label>Forma de pagamento</label>
      <select id="payment">
        <option value="">Selecione</option>
        <option>Pix</option>
        <option>Cartão de crédito</option>
        <option>Cartão de débito</option>
        <option>Dinheiro</option>
      </select>
    </div>

    <div class="form-group">
      <label>Observação</label>
      <textarea id="observation" rows="3" placeholder="Alguma observação para o pedido?"></textarea>
    </div>

    <button class="checkout-btn" onclick="placeOrder()">
      Enviar pedido
    </button>

  </div>
</div>

<div class="modal" id="successModal">
  <div class="modal-content">

    <div class="success">
      <div style="font-size:55px">✅</div>

      <h2>Pedido enviado!</h2>

      <div class="order-number" id="orderNumber"></div>

      <p>Seu pedido foi registrado.</p>

      <div class="status">
        <div class="status-step active">✓ Pedido recebido</div>
        <div class="status-step">🍔 Em preparo</div>
        <div class="status-step">🛵 Saiu para entrega</div>
        <div class="status-step">🏠 Entregue</div>
      </div>

      <button class="checkout-btn" onclick="closeModal('successModal')">
        Voltar ao cardápio
      </button>
    </div>

  </div>
</div>

<script>

  },

  {

  },

  {

  {

    description: "Pão macio, carne bovina, ovo, presunto, queijo prato, salada, batata palha e bacon crocante, com ketchup, mostarda, maionese e barbecue."
  },

  {
    category: "hamburgueres",

    price: 19.99,
    description: "Pão macio e fresquinho, carne bovina, carne sabor picanha, presunto douradinho, queijo minas derretido, batata palha e salada fresquinha. Acompanha ketchup, barbecue e maionese."
  },

  },

  },

  {

  },

  {

  },

  {

    price: 6,

  },

  {
    category: "bebidas",
    name: "Água Mineral 500 ml",
    price: 5,
    description: "Água mineral 500 ml."
  },

  {
    category: "adicionais",
    name: "Maionese",

    description: "Adicional de maionese."
  },

  {

    price: 3,

  {
    category: "adicionais",

  {

  {

    price: 4,
    description: "Adicional de molho verde."
  },

  {

  },

  {

    name: "Ovo",
    price: 5,

  },

  {
    category: "porcoes",
    name: "Batata Frita P",
    price: 15,
    description: "Porção de batata frita tamanho P."
  },

  {
    category: "porcoes",
    name: "Batata Frita M",
    price: 21.99,
    description: "Porção de batata frita tamanho M."
  },

  {
    category: "porcoes",
    name: "Batata Frita G",
    price: 30,
    description: "Porção de batata frita tamanho G."
  },

  {
    category: "frango",
    name: "Frango Assado Completo",
    price: 45,
    description: "Frango assado douradinho e suculento, acompanhado de linguiça de churrasco, batatas, calabresas e uma deliciosa farofa crocante."
  }

];

let cart = JSON.parse(localStorage.getItem("vf_cart")) || [];

const categoryNames = {
  hamburgueres: "🍔 Hambúrgueres",
  combos: "🍱 Combos",
  promocoes: "🏷️ Promoções",
  bebidas: "🥤 Bebidas",
  adicionais: "➕ Adicionais",
  porcoes: "🍟 Porções",
  frango: "🍗 Frango Assado"
};

function money(value) {
  return value.toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}

function saveCart() {
  localStorage.setItem("vf_cart", JSON.stringify(cart));
}

function renderProducts() {

  const search = document
    .getElementById("search")
    .value
    .toLowerCase()
    .trim();

  const menu = document.getElementById("menu");

  const categories = [
    "hamburgueres",
    "combos",
    "promocoes",
    "bebidas",
    "adicionais",
    "porcoes",
    "frango"
  ];

  menu.innerHTML = "";

  categories.forEach(category => {

    const filtered = products.filter(product => {

      return product.category === category &&
        (
          !search ||
          product.name.toLowerCase().includes(search) ||
          product.description.toLowerCase().includes(search)
        );

    });

    if (!filtered.length) return;

    const section = document.createElement("section");

    section.className = "category";
    section.id = category;

    section.innerHTML = `<h2>${categoryNames[category]}</h2>`;

    filtered.forEach(product => {

      const card = document.createElement("div");

      card.className = "product";

      card.innerHTML = `
        <h3>${product.name}</h3>

        <div class="description">
          ${product.description}
        </div>

        <div class="product-bottom">
          <div class="price">
            ${money(product.price)}
          </div>

          <button class="add"
            onclick="addToCart('${escapeQuotes(product.name)}')">
            Adicionar
          </button>
        </div>
      `;

      section.appendChild(card);

    });

    menu.appendChild(section);

  });

}

function escapeQuotes(text) {
  return text.replace(/'/g, "\\'");
}

function addToCart(name) {

  const product = products.find(p => p.name === name);

  if (!product) return;

  const existing = cart.find(item => item.name === name);

  if (existing) {
    existing.quantity++;
  } else {
    cart.push({
      name: product.name,
      price: product.price,
      quantity: 1
    });
  }

  saveCart();
  updateCart();

}

function removeOne(index) {

  if (cart[index].quantity > 1) {
    cart[index].quantity--;
  } else {
    cart.splice(index, 1);
  }

  saveCart();
  updateCart();
  renderCart();

}

function addOne(index) {

  cart[index].quantity++;

  saveCart();
  updateCart();
  renderCart();

}

function updateCart() {

  const count = cart.reduce(
    (total, item) => total + item.quantity,
    0
  );

  const total = cart.reduce(
    (sum, item) => sum + item.price * item.quantity,
    0
  );

  document.getElementById("cartCount").textContent = count;
  document.getElementById("cartTotal").textContent = money(total);

}

function renderCart() {

  const container = document.getElementById("cartItems");

  if (!cart.length) {

    container.innerHTML = `
      <div class="empty">
        Seu carrinho está vazio. 🍔
      </div>
    `;

  } else {

    container.innerHTML = cart.map((item, index) => {

      return `
        <div class="cart-item">

          <div class="cart-item-top">
            <strong>${item.name}</strong>
            <strong>${money(item.price * item.quantity)}</strong>
          </div>

          <div class="quantity">

            <button onclick="removeOne(${index})">−</button>

            <span>${item.quantity}</span>

            <button onclick="addOne(${index})">+</button>

          </div>

        </div>
      `;

    }).join("");

  }

  const total = cart.reduce(
    (sum, item) => sum + item.price * item.quantity,
    0
  );

  document.getElementById("modalTotal").textContent = money(total);

}

function openCart() {

  renderCart();

  document
    .getElementById("cartModal")
    .classList.add("show");

}

function openCheckout() {

  if (!cart.length) {
    alert("Seu carrinho está vazio.");
    return;
  }

  closeModal("cartModal");

  document
    .getElementById("checkoutModal")
    .classList.add("show");

}

function closeModal(id) {

  document
    .getElementById(id)
    .classList.remove("show");

}

function placeOrder() {

  if (!cart.length) {
    alert("Seu carrinho está vazio.");
    return;
  }

  const name =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("customerPhone").value.trim();

  const address =
    document.getElementById("customerAddress").value.trim();

  const payment =
    document.getElementById("payment").value;

  if (!name || !phone || !address || !payment) {

    alert(
      "Preencha nome, telefone, endereço e forma de pagamento."
    );

    return;
  }

  const orderNumber =
    Math.floor(1000 + Math.random() * 9000);

  const order = {

    number: orderNumber,

    customer: {
      name,
      phone,
      address,
      payment,
      observation:
        document.getElementById("observation").value.trim()
    },

    items: cart,

    total: cart.reduce(
      (sum, item) =>
        sum + item.price * item.quantity,
      0
    ),

    status: "Pedido recebido",

    createdAt:
      new Date().toISOString()

  };

  localStorage.setItem(
    "vf_last_order",
    JSON.stringify(order)
  );

  document.getElementById("orderNumber").textContent =
    "Pedido #" + orderNumber;

  cart = [];

  saveCart();
  updateCart();

  closeModal("checkoutModal");

  document
    .getElementById("successModal")
    .classList.add("show");

}

function goTo(category, button) {

  document
    .getElementById(category)
    ?.scrollIntoView({
      behavior: "smooth"
    });

  document
    .querySelectorAll(".category-btn")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  button.classList.add("active");

}

renderProducts();
updateCart();

</script>

</body>
