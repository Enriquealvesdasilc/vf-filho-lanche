<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VF FILHOS LANCHES</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #fff;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    /* ================= HEADER ================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 72px;
      background: #050505;
      border-bottom: 1px solid #c9a227;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .menu-btn {
      width: 46px;
      height: 46px;
      border: 1px solid #c9a227;
      border-radius: 10px;
      background: #0d0d0d;
      color: #d4af37;
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-btn:hover {
      background: #171717;
    }

    .logo-topo {
      height: 54px;
      max-width: 180px;
      object-fit: contain;
    }

    .cart-button {
      min-width: 46px;
      height: 46px;
      padding: 0 12px;
      border: 1px solid #c9a227;
      border-radius: 10px;
      background: #0d0d0d;
      color: #d4af37;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ================= MENU LATERAL ================= */

    .menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      z-index: 1998;
      display: none;
    }

    .menu-overlay.active {
      display: block;
    }

    .side-menu {
      position: fixed;
      left: -320px;
      top: 0;
      width: 300px;
      max-width: 85%;
      height: 100vh;
      background: #080808;
      border-right: 1px solid #c9a227;
      z-index: 1999;
      transition: left .25s ease;
      overflow-y: auto;
    }

    .side-menu.active {
      left: 0;
    }

    .side-header {
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px;
      border-bottom: 1px solid #2b2b2b;
    }

    .side-logo {
      width: 145px;
      max-height: 70px;
      object-fit: contain;
    }

    .close-menu {
      border: 1px solid #c9a227;
      background: transparent;
      color: #d4af37;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      font-size: 24px;
      cursor: pointer;
    }

    .menu-title {
      color: #d4af37;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      padding: 20px 18px 10px;
      letter-spacing: 1px;
    }

    .menu-option {
      width: 100%;
      background: transparent;
      color: #fff;
      border: 0;
      border-bottom: 1px solid #191919;
      text-align: left;
      padding: 17px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .menu-option:hover {
      background: #151515;
      color: #d4af37;
    }

    /* ================= CONTEÚDO ================= */

    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px 15px 100px;
    }

    .hero {
      background: linear-gradient(135deg, #111, #050505);
      border: 1px solid #282828;
      border-radius: 16px;
      padding: 24px 20px;
      margin-bottom: 18px;
    }

    .hero h1 {
      color: #d4af37;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .hero p {
      color: #bbb;
      font-size: 14px;
    }

    /* ================= BUSCA ================= */

    .search-box {
      margin: 15px 0 18px;
    }

    .search-box input {
      width: 100%;
      height: 48px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #101010;
      color: #fff;
      padding: 0 15px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #d4af37;
    }

    /* ================= CATEGORIAS ================= */

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 5px 0 15px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      flex: 0 0 auto;
      border: 1px solid #4a4a4a;
      background: #111;
      color: #ddd;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }

    .category-btn.active {
      background: #d4af37;
      color: #000;
      border-color: #d4af37;
      font-weight: bold;
    }

    /* ================= FRANGO BLOQUEADO ================= */

    .frango-aviso {
      display: none;
      background: #111;
      border: 1px solid #8c741c;
      color: #d4af37;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin: 10px 0 20px;
    }

    .frango-aviso strong {
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .frango-aviso span {
      color: #bbb;
      font-size: 14px;
    }

    /* ================= PRODUTOS ================= */

    .section-title {
      color: #d4af37;
      font-size: 21px;
      margin: 10px 0 15px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .product {
      background: #0e0e0e;
      border: 1px solid #242424;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 190px;
    }

    .product:hover {
      border-color: #8f7620;
    }

    .product h3 {
      color: #fff;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .product p {
      color: #999;
      font-size: 13px;
      line-height: 1.4;
      flex: 1;
    }

    .product-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
    }

    .price {
      color: #d4af37;
      font-size: 18px;
      font-weight: bold;
    }

    .add-btn {
      border: 0;
      background: #d4af37;
      color: #000;
      font-weight: bold;
      border-radius: 8px;
      padding: 10px 13px;
      cursor: pointer;
    }

    .add-btn:hover {
      background: #e3c353;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 35px;
      color: #999;
    }

    /* ================= CARRINHO ================= */

    .cart-panel {
      position: fixed;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 460px;
      background: #080808;
      border: 1px solid #c9a227;
      border-bottom: 0;
      border-radius: 18px 18px 0 0;
      z-index: 1500;
      padding: 18px;
      transform: translateY(110%);
      transition: transform .25s ease;
      max-height: 82vh;
      overflow-y: auto;
    }

    .cart-panel.active {
      transform: translateY(0);
    }

    .cart-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .cart-title h2 {
      color: #d4af37;
      font-size: 20px;
    }

    .close-cart {
      background: transparent;
      color: #fff;
      border: 1px solid #444;
      border-radius: 7px;
      width: 35px;
      height: 35px;
      cursor: pointer;
    }

    .cart-item {
      border-bottom: 1px solid #222;
      padding: 12px 0;
    }

    .cart-item-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .cart-item-name {
      font-weight: bold;
    }

    .cart-item-price {
      color: #d4af37;
      font-weight: bold;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 8px;
    }

    .quantity button {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      border: 1px solid #555;
      background: #171717;
      color: #fff;
      cursor: pointer;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      padding: 18px 0;
      font-size: 20px;
      font-weight: bold;
    }

    .cart-total span:last-child {
      color: #d4af37;
    }

    .checkout-btn {
      width: 100%;
      height: 50px;
      background: #d4af37;
      border: 0;
      border-radius: 10px;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ================= MODAL CHECKOUT ================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.82);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 600px;
      max-height: 92vh;
      overflow-y: auto;
      background: #090909;
      border: 1px solid #c9a227;
      border-radius: 16px;
      padding: 22px;
    }

    .modal-box h2 {
      color: #d4af37;
      margin-bottom: 18px;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      color: #bbb;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      border-radius: 8px;
      padding: 12px;
      outline: none;
    }

    .field textarea {
      min-height: 80px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #d4af37;
    }

    .delivery-type {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .delivery-type button {
      padding: 13px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
    }

    .delivery-type button.active {
      background: #d4af37;
      color: #000;
      border-color: #d4af37;
      font-weight: bold;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .modal-actions button {
      flex: 1;
      height: 48px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .cancel-btn {
      background: #171717;
      color: #fff;
      border: 1px solid #444;
    }

    .confirm-btn {
      background: #d4af37;
      color: #000;
      border: 0;
    }

    /* ================= SUCESSO ================= */

    .success {
      text-align: center;
      padding: 20px 5px;
    }

    .success h2 {
      color: #d4af37;
      font-size: 26px;
    }

    .order-number {
      font-size: 32px;
      font-weight: bold;
      margin: 18px 0;
      color: #fff;
    }

    /* ================= TOAST ================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translate(-50%, 120px);
      background: #d4af37;
      color: #000;
      padding: 13px 18px;
      border-radius: 8px;
      font-weight: bold;
      z-index: 5000;
      transition: .25s;
    }

    .toast.show {
      transform: translate(-50%, 0);
    }

    @media (max-width: 600px) {
      .products {
        grid-template-columns: 1fr;
      }

      .logo-topo {
        max-width: 145px;
      }

      header {
        padding: 0 12px;
      }

      .hero h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= MENU LATERAL ================= -->

  <div class="menu-overlay" id="menuOverlay" onclick="fecharMenu()"></div>

  <aside class="side-menu" id="sideMenu">

      <button class="close-menu" onclick="fecharMenu()">×</button>
    </div>

    <div class="menu-title">Menu</div>

    <button class="menu-option" onclick="irCategoria('hamburgueres')">
      🍔 Hambúrgueres
    </button>

    <button class="menu-option" onclick="irCategoria('combos')">
      🍟 Combos
    </button>

    <button class="menu-option" onclick="irCategoria('promocoes')">
      🔥 Promoções
    </button>

    <button class="menu-option" onclick="irCategoria('bebidas')">
      🥤 Bebidas
    </button>

    <button class="menu-option" onclick="irCategoria('adicionais')">
      ➕ Adicionais
    </button>

    <button class="menu-option" onclick="irCategoria('porcoes')">
      🍟 Porções
    </button>

    <button class="menu-option" onclick="irCategoria('frango')">
      🍗 Frango Assado
    </button>

    <div class="menu-title">Pedido</div>

    <button class="menu-option" onclick="abrirCarrinho(); fecharMenu();">
      Meu carrinho
    </button>

    <button class="menu-option" onclick="abrirCheckout(); fecharMenu();">
      Finalizar pedido
    </button>

  </aside>

  <!-- ================= HEADER ================= -->

      </button>

        🍟 Porções
      </button>

      <button class="category-btn" data-category="frango"

      </button>

  <section class="cart-panel" id="cartPanel">

      </button>
    </div>

    <div class="cart-total">

  <!-- ================= CHECKOUT ================= -->

  <div class="modal" id="checkoutModal">

    <div class="modal-box">

      <h2>Finalizar pedido</h2>

      <div class="delivery-type">

        <button
          id="btnEntrega"
          class="active"

        </button>

        <button
          id="btnRetirada"
          onclick="selecionarEntrega('Retirada')">
          Retirada
        </button>

      </div>

      <div class="field">
        <label>Nome</label>
        <input id="clienteNome" type="text" placeholder="Seu nome">
      </div>

      <div class="field">
        <label>Telefone</label>
        <input id="telefone" type="tel" placeholder="Seu telefone">
      </div>

      <div id="enderecoFields">

        <div class="field">
          <label>Endereço</label>
          <input id="endereco" type="text" placeholder="Rua / Avenida">
        </div>

        <div class="field">
          <label>Número</label>
          <input id="numero" type="text" placeholder="Número">
        </div>

        <div class="field">
          <label>Complemento</label>
          <input id="complemento" type="text" placeholder="Apartamento, casa etc.">
        </div>

        <div class="field">
          <label>Bairro</label>
          <input id="bairro" type="text" placeholder="Seu bairro">
        </div>

        <div class="field">
          <label>Referência</label>
          <input id="referencia" type="text" placeholder="Ponto de referência">
        </div>

      </div>

      <div class="field">
        <label>Forma de pagamento</label>

        <select id="pagamento">
          <option value="">Selecione</option>
          <option value="Pix">Pix</option>
          <option value="Dinheiro">Dinheiro</option>
          <option value="Cartão de Crédito">Cartão de Crédito</option>
          <option value="Cartão de Débito">Cartão de Débito</option>
        </select>
      </div>

      <div class="field" id="trocoField" style="display:none;">
        <label>Troco para quanto?</label>
        <input id="troco" type="text" placeholder="Ex.: R$ 50,00">
      </div>

      <div class="field">
        <label>Observações</label>

        <textarea
          id="observacoes"
          placeholder="Alguma observação sobre o pedido?"></textarea>
      </div>

      <div class="modal-actions">

        <button
          class="cancel-btn"
          onclick="fecharCheckout()">
          Voltar
        </button>

        <button
          class="confirm-btn"
          onclick="enviarPedido()">
          Confirmar pedido
        </button>

      </div>

    </div>

  </div>

  <!-- ================= SUCESSO ================= -->

  <div class="modal" id="successModal">

    <div class="modal-box success">

      <h2>Pedido recebido!</h2>

      <p style="margin-top:10px;color:#bbb;">

      <div class="order-number" id="orderNumber">

      </div>

      <button

      </button>

    </div>

    /* =====================================================
       ESTADO
    ===================================================== */

    let categoriaAtual = "hamburgueres";

    let tipoEntrega = "Entrega";

    let carrinho = JSON.parse(
      localStorage.getItem("vf_cart") || "[]"
    );

    /* =====================================================
       UTILIDADES
    ===================================================== */

    function dinheiro(valor) {
      return Number(valor).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function mostrarToast(texto) {
      const toast = document.getElementById("toast");

      toast.textContent = texto;
      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    function salvarCarrinho() {
      localStorage.setItem(
        "vf_cart",
        JSON.stringify(carrinho)
      );

      atualizarCarrinho();
    }

    /* =====================================================
       MENU HAMBÚRGUER
    ===================================================== */

    function abrirMenu() {
      document
        .getElementById("sideMenu")
        .classList.add("active");

      document
        .getElementById("menuOverlay")
        .classList.add("active");
    }

    function fecharMenu() {
      document
        .getElementById("sideMenu")
        .classList.remove("active");

      document
        .getElementById("menuOverlay")
        .classList.remove("active");
    }

    /* =====================================================
       FRANGO - SOMENTE SÁBADO E DOMINGO
    ===================================================== */

    function frangoDisponivel() {

      const hoje = new Date().getDay();

      /*
        0 = domingo
        6 = sábado
      */

      return hoje === 0 || hoje === 6;
    }

    /* =====================================================
       CATEGORIAS
    ===================================================== */

    function selecionarCategoria(categoria) {

      categoriaAtual = categoria;

      document
        .querySelectorAll(".category-btn")
        .forEach(btn => {

          btn.classList.toggle(
            "active",
            btn.dataset.category === categoria
          );

        });

      const nomes = {
        hamburgueres: "Hambúrgueres",
        combos: "Combos",
        promocoes: "Promoções",
        bebidas: "Bebidas",
        adicionais: "Adicionais",
        porcoes: "Porções",
        frango: "Frango Assado"
      };

      document.getElementById("categoryTitle").textContent =
        nomes[categoria];

      renderProdutos();
    }

    function irCategoria(categoria) {

      fecharMenu();

      selecionarCategoria(categoria);

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    /* =====================================================
       RENDER PRODUTOS
    ===================================================== */

    function renderProdutos() {

      const container =
        document.getElementById("products");

      const aviso =
        document.getElementById("frangoAviso");

      const busca =
        document
          .getElementById("searchInput")
          .value
          .trim()
          .toLowerCase();

      /* FRANGO BLOQUEADO */

      if (
        categoriaAtual === "frango" &&
        !frangoDisponivel()
      ) {

        aviso.style.display = "block";
        container.innerHTML = "";

        return;
      }

      aviso.style.display = "none";

      let lista = produtos.filter(
        produto =>
          produto.categoria === categoriaAtual
      );

      if (busca) {

        lista = lista.filter(produto =>
          produto.nome
            .toLowerCase()
            .includes(busca) ||
          produto.descricao
            .toLowerCase()
            .includes(busca)
        );

      }

      if (!lista.length) {

        container.innerHTML =
          `<div class="empty">
             Nenhum produto encontrado.
           </div>`;

        return;
      }

      container.innerHTML = lista.map(produto => `

        <article class="product">

          <h3>${produto.nome}</h3>

          <p>${produto.descricao}</p>

          <div class="product-bottom">

            <span class="price">
              ${dinheiro(produto.preco)}
            </span>

            <button
              class="add-btn"
              onclick="adicionarCarrinho('${produto.id}')">
              Adicionar
            </button>

          </div>

        </article>

      `).join("");
    }

    /* =====================================================
       CARRINHO
    ===================================================== */

    function adicionarCarrinho(id) {

      const produto =
        produtos.find(p => p.id === id);

      if (!produto) return;

      /* Proteção extra do frango */

      if (
        produto.categoria === "frango" &&
        !frangoDisponivel()
      ) {

        mostrarToast(
          "Frango Assado disponível somente sábado e domingo."
        );

        return;
      }

      const existente =
        carrinho.find(item => item.id === id);

      if (existente) {

        existente.quantidade++;

      } else {

        carrinho.push({
          id: produto.id,
          nome: produto.nome,
          preco: produto.preco,
          quantidade: 1
        });

      }

      salvarCarrinho();

      mostrarToast("Produto adicionado ao carrinho.");
    }

    function alterarQuantidade(id, quantidade) {

      const item =
        carrinho.find(i => i.id === id);

      if (!item) return;

      item.quantidade += quantidade;

      if (item.quantidade <= 0) {

        carrinho =
          carrinho.filter(i => i.id !== id);

      }

      salvarCarrinho();
    }

    function totalCarrinho() {

      return carrinho.reduce(
        (total, item) =>
          total + item.preco * item.quantidade,
        0
      );
    }

    function atualizarCarrinho() {

      const quantidade =
        carrinho.reduce(
          (total, item) =>
            total + item.quantidade,
          0
        );

      document.getElementById("cartButton")
        .textContent = quantidade;

      const container =
        document.getElementById("cartItems");

      if (!carrinho.length) {

        container.innerHTML =
          `<div class="empty">
             Seu carrinho está vazio.
           </div>`;

      } else {

        container.innerHTML =
          carrinho.map(item => `

            <div class="cart-item">

              <div class="cart-item-top">

                <span class="cart-item-name">
                  ${item.nome}
                </span>

                <span class="cart-item-price">
                  ${dinheiro(item.preco * item.quantidade)}
                </span>

              </div>

              <div class="quantity">

                <button
                  onclick="alterarQuantidade('${item.id}', -1)">
                  −
                </button>

                <strong>
                  ${item.quantidade}
                </strong>

                <button
                  onclick="alterarQuantidade('${item.id}', 1)">
                  +
                </button>

              </div>

            </div>

          `).join("");
      }

      document.getElementById("cartTotal")
        .textContent = dinheiro(totalCarrinho());
    }

    function abrirCarrinho() {

      document
        .getElementById("cartPanel")
        .classList.add("active");

      atualizarCarrinho();
    }

    function fecharCarrinho() {

      document
        .getElementById("cartPanel")
        .classList.remove("active");
    }

    /* =====================================================
       CHECKOUT
    ===================================================== */

    function selecionarEntrega(tipo) {

      tipoEntrega = tipo;

      document
        .getElementById("btnEntrega")
        .classList.toggle(
          "active",
          tipo === "Entrega"
        );

      document
        .getElementById("btnRetirada")
        .classList.toggle(
          "active",
          tipo === "Retirada"
        );

      document
        .getElementById("enderecoFields")
        .style.display =
          tipo === "Entrega"
            ? "block"
            : "none";
    }

    function abrirCheckout() {

      if (!carrinho.length) {

        mostrarToast(
          "Adicione produtos ao carrinho primeiro."
        );

        return;
      }

      fecharCarrinho();

      document
        .getElementById("checkoutModal")
        .classList.add("active");
    }

    function fecharCheckout() {

      document
        .getElementById("checkoutModal")
        .classList.remove("active");
    }

    document
      .getElementById("pagamento")
      .addEventListener("change", function() {

        document
          .getElementById("trocoField")
          .style.display =
            this.value === "Dinheiro"
              ? "block"
              : "none";

      });

    /* =====================================================
       ENVIAR PEDIDO SUPABASE
    ===================================================== */

    async function enviarPedido() {

      if (!carrinho.length) {

        mostrarToast("Carrinho vazio.");

        return;
      }

      const nome =
        document
          .getElementById("clienteNome")
          .value
          .trim();

      const telefone =
        document
          .getElementById("telefone")
          .value
          .trim();

      const pagamento =
        document
          .getElementById("pagamento")
          .value;

      if (!nome) {

        mostrarToast("Digite seu nome.");

        return;
      }

      if (!pagamento) {

        mostrarToast("Selecione o pagamento.");

        return;
      }

      if (
        tipoEntrega === "Entrega" &&
        !document.getElementById("endereco").value.trim()
      ) {

        mostrarToast("Digite o endereço.");

        return;
      }

      const pedido = {

        cliente_nome: nome,

        telefone: telefone,

        tipo_entrega: tipoEntrega,

        endereco:
          tipoEntrega === "Entrega"
            ? document.getElementById("endereco").value.trim()
            : "",

        numero:
          tipoEntrega === "Entrega"
            ? document.getElementById("numero").value.trim()
            : "",

        complemento:
          tipoEntrega === "Entrega"
            ? document.getElementById("complemento").value.trim()
            : "",

        bairro:
          tipoEntrega === "Entrega"
            ? document.getElementById("bairro").value.trim()
            : "",

        referencia:
          tipoEntrega === "Entrega"
            ? document.getElementById("referencia").value.trim()
            : "",

        pagamento: pagamento,

        troco:
          pagamento === "Dinheiro"
            ? document.getElementById("troco").value.trim()
            : "",

        itens: carrinho,

        subtotal: totalCarrinho(),

        taxa_entrega: 0,

        total: totalCarrinho(),

        observacoes:
          document
            .getElementById("observacoes")
            .value
            .trim(),

        status: "novo"

      };

      try {

        const resposta = await fetch(
          `${SUPABASE_URL}/rest/v1/pedidos`,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Authorization":
                `Bearer ${SUPABASE_KEY}`,
              "Prefer":
                "return=representation"
            },

            body: JSON.stringify(pedido)
          }
        );

        if (!resposta.ok) {

          const erro =
            await resposta.text();

          console.error(erro);

          mostrarToast(
            "Não foi possível enviar o pedido."
          );

          return;
        }

        const dados =
          await resposta.json();

        const pedidoCriado =
          Array.isArray(dados)
            ? dados[0]
            : dados;

        const numero =
          pedidoCriado?.numero_pedido ||
          (
            "#" +
            String(
              pedidoCriado?.id || "0000"
            ).padStart(4, "0")
          );

        document.getElementById("orderNumber")
          .textContent = numero;

        carrinho = [];

        salvarCarrinho();

        fecharCheckout();

        document
          .getElementById("successModal")
          .classList.add("active");

      } catch (erro) {

        console.error(erro);

        mostrarToast(
          "Erro de conexão. Tente novamente."
        );

      }

    }

    function fecharSucesso() {

      document
        .getElementById("successModal")
        .classList.remove("active");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    /* =====================================================
       INICIALIZAÇÃO
    ===================================================== */

    selecionarEntrega("Entrega");

    renderProdutos();

    atualizarCarrinho();

  </script>
